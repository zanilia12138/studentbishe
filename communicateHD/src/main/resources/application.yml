# ---------- 上传（资料与图片根目录可不同）----------
# doc-path：学习资料 PDF 等存放根目录（文件直接放此目录，URL 仍为 /uploads/loads/doc/文件名）
# pic-path：帖子配图、打卡图等存放根目录（URL 仍为 /uploads/loads/pic/文件名）
# legacy-path：旧版 /uploads/post、/uploads/clock、以及根目录散落文件；可与原 uploads 目录相同
# 示例（两台盘）：doc-path: D:/data/exam-materials   pic-path: E:/data/exam-images
file:
  upload:
    doc-path: ./uploads/loads/doc
    pic-path: ./uploads/loads/pic
    legacy-path: ./uploads
    # 设为 true 启动一次：把 material 表中旧路径 /uploads/文件名 迁入 doc-path 并更新 file_path；完成后改回 false
    migrate-legacy-materials: false
